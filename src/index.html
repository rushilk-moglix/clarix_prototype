    <!-- Theme before first paint (also on the sign in page): no white flash for dark mode users. -->
    <script>try{var c=(JSON.parse(localStorage.getItem('clarix-theme-config')||'{}').colorScheme)||'system';var d=c==='dark'||(c==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.add(d?'dark':'light')}catch(e){}</script>
    <style>html{background:#fff}html.dark{background:#000}</style>
