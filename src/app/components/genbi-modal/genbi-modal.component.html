<div class="genbi-overlay" role="presentation" (click)="close()" aria-hidden="true"></div>

<div
  class="genbi-panel"
  role="dialog"
  aria-modal="true"
  aria-label="GenBi Analytics"
  (click)="$event.stopPropagation()"
>
  <div class="genbi-panel-header">
    <span class="genbi-panel-title">
      <lucide-icon name="chart-column" [size]="16"></lucide-icon>
      GenBi Analytics
    </span>
    <button class="genbi-close-btn" (click)="close()" aria-label="Close GenBi modal">
      <lucide-icon name="x" [size]="18"></lucide-icon>
    </button>
  </div>

  <div class="genbi-panel-body">
    <iframe
      [src]="safeUrl()"
      class="genbi-iframe"
      title="GenBi Analytics"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation-by-user-activation"
      loading="lazy"
    ></iframe>
  </div>
</div>
