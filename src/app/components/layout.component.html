<div class="app-layout" [class.sn-pinned]="pinned()">
  <app-side-nav [(pinned)]="pinned" [(drawer)]="drawer"></app-side-nav>

  <div class="main-wrapper">
    <!-- Header: where you are, the page's tabs if it has any, and two tools. Flat, no pill. -->
    <header class="hd">
      <button type="button" class="hd-icon hd-menu" (click)="drawer.set(true)" aria-label="Open menu"><lucide-icon name="menu" [size]="18"></lucide-icon></button>
      <div class="hd-where">
        @if (here(); as h) {
          <span class="hd-eyebrow"><i></i>{{ h.group }}</span>
          <span class="hd-title">{{ h.label }}</span>
        }
      </div>
      @if (tabs().length > 1) {
        <nav class="hd-tabs" aria-label="Pages">
          @for (t of tabs(); track t.route) {
            <a class="hd-tab" [routerLink]="t.route" routerLinkActive="active">{{ t.label }}</a>
          }
        </nav>
      }
      <span class="hd-space"></span>
    </header>

    <main class="main-content">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <app-toast-container></app-toast-container>
</div>
